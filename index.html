<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c0c">
<title>MLX Production</title>
<meta name="description" content="MLX Production: knihovna assetů, půjčovna, aplikace a obchod.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c0c; --ink:#ECEAE4; --mute:#8b8982; --edge:rgba(236,234,228,.85); --teal:#1FB3A5;
  --f:'Archivo','Helvetica Neue',Arial,sans-serif; --m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;border-radius:0}
body{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.nogl body{background-image:radial-gradient(circle,rgba(236,234,228,.12) 1px,transparent 1.6px);background-size:22px 22px}
#gl,.vig{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vig{background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 40%,rgba(11,12,12,.85) 100%)}
main,footer{position:relative;z-index:1}
:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
a,button{color:inherit;text-decoration:none}

/* page transition: fades in from black on arrival, fades to black on leave */
.blk{position:fixed;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;animation:fin .9s cubic-bezier(.4,0,.2,1) both}
@keyframes fin{from{opacity:1}to{opacity:0}}
@keyframes fout{from{opacity:0}to{opacity:1}}
body.dk .blk{pointer-events:auto;animation:fout .9s cubic-bezier(.4,0,.2,1) both}

/* intro: a slanted slab opens from the centre, uncovering the title, then slides off to the right (same angle as the button sweep) */
.tx{position:relative;display:inline-block}
.tx .tt{display:inline-block;animation:ttin 1.15s cubic-bezier(.65,0,.25,1) .35s both}
.tx::after{content:"";position:absolute;inset:-2px -8px;background:var(--ink);pointer-events:none;
  clip-path:polygon(calc(100% + 80px) 0,calc(100% + 80px) 0,calc(100% + 46px) 100%,calc(100% + 46px) 100%);
  animation:slab 1.15s cubic-bezier(.65,0,.25,1) .35s both}
@keyframes slab{
  0%{clip-path:polygon(calc(50% + 17px) 0,calc(50% + 17px) 0,calc(50% - 17px) 100%,calc(50% - 17px) 100%)}
  45%{clip-path:polygon(-6px 0,calc(100% + 40px) 0,calc(100% + 6px) 100%,-40px 100%)}
  100%{clip-path:polygon(calc(100% + 80px) 0,calc(100% + 80px) 0,calc(100% + 46px) 100%,calc(100% + 46px) 100%)}}
@keyframes ttin{
  0%{clip-path:polygon(calc(50% + 17px) 0,calc(50% + 17px) 0,calc(50% - 17px) 100%,calc(50% - 17px) 100%)}
  45%{clip-path:polygon(-6px 0,calc(100% + 40px) 0,calc(100% + 6px) 100%,-40px 100%)}
  46%,100%{clip-path:polygon(-40px -40px,calc(100% + 40px) -40px,calc(100% + 40px) calc(100% + 40px),-40px calc(100% + 40px))}}

/* buttons wipe in one after another with the same slanted edge as the hover sweep */
.links li{animation:lin .75s cubic-bezier(.65,0,.25,1) backwards}
.links li:nth-child(1){animation-delay:1.0s}
.links li:nth-child(2){animation-delay:1.12s}
.links li:nth-child(3){animation-delay:1.24s}
.links li:nth-child(4){animation-delay:1.36s}
@keyframes lin{from{clip-path:polygon(0 0,0 0,-34px 100%,0 100%)}to{clip-path:polygon(0 0,calc(100% + 34px) 0,100% 100%,0 100%)}}
footer{animation:fin2 .8s ease-out 1.6s backwards}
@keyframes fin2{from{opacity:0}to{opacity:1}}

main{width:100%;max-width:520px;padding:clamp(56px,14vh,140px) 20px 40px;flex:1}
h1{text-align:center;font-weight:800;font-stretch:80%;font-size:clamp(44px,12vw,60px);line-height:1;letter-spacing:-.02em}
.links{list-style:none;margin-top:44px;display:grid;gap:12px}

.btn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;
  background:var(--bg);border:2px solid var(--edge);overflow:hidden;isolation:isolate;transition:color .3s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);
  clip-path:polygon(0 0,0 0,-34px 100%,0 100%);
  transition:clip-path .5s cubic-bezier(.65,0,.25,1)}
.btn:hover,.btn:focus-visible{color:var(--bg)}
.btn:hover::before,.btn:focus-visible::before{clip-path:polygon(0 0,calc(100% + 34px) 0,100% 100%,0 100%)}
.t{display:flex;flex-direction:column;gap:2px}
.n{font-weight:700;font-size:19px;letter-spacing:-.01em}
.d{font-size:13px;color:var(--mute);transition:color .3s}
.btn:hover .d,.btn:focus-visible .d{color:inherit;opacity:.7}
.ar{flex:none;width:18px;height:18px;transition:transform .4s cubic-bezier(.65,0,.25,1)}
.btn:hover .ar,.btn:focus-visible .ar{transform:translateX(5px)}

footer{width:100%;max-width:520px;padding:0 20px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--m);font-size:11px;letter-spacing:.06em;color:var(--mute)}
footer a{transition:color .2s}footer a:hover{color:var(--ink)}

/* region prompt */
.reg{position:fixed;z-index:20;top:calc(24px + env(safe-area-inset-top,0px));right:24px;
  padding:14px;
  background:rgba(11,12,12,.92);border:1px solid rgba(236,234,228,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .9s cubic-bezier(.4,0,.2,1),transform .9s cubic-bezier(.4,0,.2,1)}
.reg.on{opacity:1;transform:none;pointer-events:auto;transition-duration:.6s}
.reg .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ink);opacity:.9;box-shadow:0 0 8px 1px rgba(236,234,228,.55),0 -2px 10px rgba(236,234,228,.25);transform-origin:left;transform:scaleX(1);will-change:transform}
.sw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;
  border:1px solid var(--edge);overflow:hidden;isolation:isolate;transition:color .3s;
  font-family:var(--m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.sw::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);
  clip-path:polygon(0 0,0 0,-34px 100%,0 100%);transition:clip-path .5s cubic-bezier(.65,0,.25,1)}
.sw:hover,.sw:focus-visible{color:var(--bg)}
.sw:hover::before,.sw:focus-visible::before{clip-path:polygon(0 0,calc(100% + 34px) 0,100% 100%,0 100%)}
.sw svg{flex:none;width:12px;height:12px;transition:transform .4s cubic-bezier(.65,0,.25,1)}
.sw:hover svg,.sw:focus-visible svg{transform:translateX(4px)}
/* dismiss: a small square badge sitting on the card's top-right corner, so it never changes the card's size */
.rx{position:absolute;top:-11px;right:-11px;width:22px;height:22px;display:grid;place-items:center;background:var(--bg);border:1px solid rgba(236,234,228,.35);cursor:pointer;color:var(--ink);overflow:hidden;isolation:isolate;transition:color .3s,border-color .3s}
.rx::before{content:"";position:absolute;inset:0;z-index:-1;background:#E5484D;clip-path:polygon(0 0,0 0,-10px 100%,0 100%);transition:clip-path .45s cubic-bezier(.65,0,.25,1)}
.rx:hover,.rx:focus-visible{color:var(--bg);border-color:#E5484D}
.rx:hover::before,.rx:focus-visible::before{clip-path:polygon(0 0,calc(100% + 10px) 0,100% 100%,0 100%)}
.rx svg{width:9px;height:9px}
@media (max-width:420px){.reg{left:16px;right:24px;top:calc(24px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vig" aria-hidden="true"></div>
<div class="blk" aria-hidden="true"></div>
<main>
  <h1><span class="tx"><span class="tt">MLX Production</span></span></h1>

  <ul class="links">
    <li><a class="btn" href="https://mlxproduction.cz/asset-librery.html">
      <span class="t"><span class="n">Knihovna assetů</span><span class="d">Záběry, zvuky a fotografie</span></span>
      <svg class="ar" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9h14M10 3l6 6-6 6"/></svg></a></li>
    <li><a class="btn" href="https://mlxproduction.cz/rental.html">
      <span class="t"><span class="n">Půjčovna</span><span class="d">Filmová a fotografická technika k zapůjčení</span></span>
      <svg class="ar" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9h14M10 3l6 6-6 6"/></svg></a></li>
    <li><a class="btn" href="https://mlxproduction.cz/asset-apps.html">
      <span class="t"><span class="n">Asset aplikace</span><span class="d">Nástroje pro váš střih</span></span>
      <svg class="ar" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9h14M10 3l6 6-6 6"/></svg></a></li>
    <li><a class="btn" href="https://mlxproduction.cz/shop.html">
      <span class="t"><span class="n">Obchod</span><span class="d">Produkty od MLX</span></span>
      <svg class="ar" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9h14M10 3l6 6-6 6"/></svg></a></li>
  </ul>
</main>
<footer>
  <a href="mailto:info@mlxproduction.cz">info@mlxproduction.cz</a>
  <span>© <span id="y">2026</span> MLX Production</span>
</footer>

<div class="reg" id="reg" role="region" aria-label="Výběr regionu">
  <a class="sw" href="https://mlxproduction.eu" id="sw">Přepnout na EU verzi
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9h14M10 3l6 6-6 6"/></svg></a>
  <button type="button" class="rx" id="rx" aria-label="Zavřít">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  <span class="bar" id="bar" aria-hidden="true"></span>
</div>

<script>
document.getElementById('y').textContent=new Date().getFullYear();

/* ---------- page transition: fade to black, then navigate ---------- */
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,busy=false,tm=0;
  function leave(href){
    if(busy)return;busy=true;
    document.body.classList.add('dk');
    tm=setTimeout(function(){window.location.href=href},reduce?0:1050);
  }
  [].forEach.call(document.querySelectorAll('.btn,#sw'),function(a){
    a.addEventListener('click',function(e){
      if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
      e.preventDefault();leave(a.href);
    });
  });
  window.addEventListener('pageshow',function(e){
    if(e.persisted){clearTimeout(tm);busy=false;document.body.classList.remove('dk')}
  });
})();

/* ---------- region prompt ---------- */
(function(){
  var box=document.getElementById('reg'),bar=document.getElementById('bar'),KEY='mlx-region-dismissed-cz',CNT='mlx-region-count-cz',MAX=5;
  /* shown on the first MAX opens of the site, unless dismissed with the cross */
  try{
    var seen=parseInt(localStorage.getItem(CNT)||'0',10)||0;
    if(localStorage.getItem(KEY)||seen>=MAX)return;
    localStorage.setItem(CNT,String(seen+1));
  }catch(e){}
  var DUR=6000,p=0,rate=1,hold=false,run=false,last=0;
  function hide(){run=false;box.classList.remove('on')}
  /* progress is driven here so pausing and resuming ease in and out instead of snapping */
  function tick(now){
    if(!run)return;
    var dt=Math.min(64,now-last);last=now;
    rate+=((hold?0:1)-rate)*(1-Math.exp(-dt/220));
    p+=dt*rate/DUR;
    bar.style.transform='scaleX('+Math.max(0,1-p)+')';
    if(p>=1){hide();return}
    requestAnimationFrame(tick);
  }
  box.addEventListener('pointerenter',function(){hold=true});
  box.addEventListener('pointerleave',function(){hold=false});
  box.addEventListener('focusin',function(){hold=true});
  box.addEventListener('focusout',function(){hold=false});
  setTimeout(function(){
    box.classList.add('on');
    setTimeout(function(){run=true;last=performance.now();requestAnimationFrame(tick)},600);
  },1200);
  document.getElementById('rx').addEventListener('click',function(){
    hide();
    try{localStorage.setItem(KEY,'1')}catch(e){}
  });
})();

/* ---------- background: GPU lens-warped dot field with twinkles (WebGL2) ---------- */
(function(){
  var cv=document.getElementById('gl'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gl=null;try{gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false,powerPreference:'low-power'})}catch(e){}
  var U0=.25,K=.27,PITCH=22,BASE=1.1,VX=-.9,VY=-2.2,OM=.0068;
  var W,H,D,R,n,GN=0,CS=1,SN=0,T0=performance.now(),live=[],nextT=0,tmp={};
  var G={},TW={},TB=new Float32Array(70);

  function sm(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}
  function mod(a){return((a%PITCH)+PITCH)%PITCH}

  if(!gl){document.documentElement.classList.add('nogl');return}

  function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
  function prog(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,'#version 300 es\n'+v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;\n'+f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}
  function loc(p,names){var o={p:p};names.split(' ').forEach(function(k){o[k]=gl.getUniformLocation(p,k)});return o}

  var WARP='const float U0=.25,K=.27;\n';

  try{
    G=loc(prog(
      WARP+'layout(location=0) in vec2 aIJ;uniform vec2 uRes,uOff,uRot;uniform float uR,uP,uDpr;'+
      'out vec2 vDir,vRad;out float vE,vA,vSz;\n'+
      'void main(){vec2 l=aIJ*uP+uOff;vec2 s=vec2(l.x*uRot.x-l.y*uRot.y,l.x*uRot.y+l.y*uRot.x);float d=length(s),u=d/uR;'+
      'if(u>1.35){gl_Position=vec4(3.,3.,3.,1.);gl_PointSize=0.;return;}'+
      'float ex=max(0.,u-U0),g=u-K*ex*ex,gp=1.-2.*K*ex;vec2 dir=d>0.?s/d:vec2(1.,0.);vec2 pos=dir*uR*g;'+
      'float t=clamp((u-.25)/1.05,0.,1.),e=t*t*(3.-2.*t);'+
      'float rr=max(.35,1.1*gp),rt=max(.35,1.1*(u>0.?g/u:1.))*(1.+.6*e*e);'+
      'vDir=dir;vRad=vec2(rr,rt);vE=e;vA=.34*(1.-.45*e);vSz=2.*(max(rr,rt)*1.15+2.4*e*e+.4)+3.;'+
      'gl_Position=vec4(pos.x/(uRes.x*.5),-pos.y/(uRes.y*.5),0.,1.);gl_PointSize=vSz*uDpr;}',
      'in vec2 vDir,vRad;in float vE,vA,vSz;out vec4 o;\n'+
      'void main(){vec2 p=(gl_PointCoord-.5)*vSz;float xr=dot(p,vDir),yr=-p.x*vDir.y+p.y*vDir.x;'+
      'float cw=clamp((1.-length(vec2(xr/vRad.x,yr/vRad.y)))*min(vRad.x,vRad.y)+.5,0.,1.);float tr=0.;'+
      'if(vE>.04){float off=2.4*vE*vE+.4;vec2 r2=vRad*1.15;tr=clamp((1.-length(vec2((xr-off)/r2.x,yr/r2.y)))*min(r2.x,r2.y)+.5,0.,1.)*min(1.,vA*2.2*vE);}'+
      'float wa=cw*vA;o=vec4(vec3(.925,.918,.894)*wa+vec3(.122,.702,.647)*tr*(1.-wa),wa+tr*(1.-wa));}'),
      'uRes uOff uRot uR uP uDpr');
    G.vao=gl.createVertexArray();G.buf=gl.createBuffer();
    gl.bindVertexArray(G.vao);gl.bindBuffer(gl.ARRAY_BUFFER,G.buf);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

    TW=loc(prog(
      'layout(location=0) in vec2 aP;layout(location=1) in vec4 aS;layout(location=2) in float aK;uniform vec2 uRes;uniform float uDpr;'+
      'out vec4 vS;out float vK,vSz;\n'+
      'void main(){vS=aS;vK=aK;vSz=14.*max(aS.x,aS.y)+2.;gl_Position=vec4(aP.x/(uRes.x*.5),-aP.y/(uRes.y*.5),0.,1.);gl_PointSize=vSz*uDpr;}',
      'in vec4 vS;in float vK,vSz;out vec4 o;\n'+
      'float Gr(float q){float a=mix(.5,.3,clamp(q/.18,0.,1.));if(q>.18)a=mix(.3,.1,clamp((q-.18)/.27,0.,1.));if(q>.45)a=mix(.1,.025,clamp((q-.45)/.3,0.,1.));if(q>.75)a=mix(.025,0.,clamp((q-.75)/.25,0.,1.));return q>=1.?0.:a;}\n'+
      'void main(){vec2 p=(gl_PointCoord-.5)*vSz;vec2 d=vS.zw;float xr=dot(p,d),yr=-p.x*d.y+p.y*d.x,rr=vS.x,rt=vS.y;'+
      'float g=Gr(length(vec2(xr,yr*rr/rt))/(rr*7.))*vK;'+
      'float c=clamp((1.-length(vec2(xr/(rr*1.6),yr/(rt*1.6))))*min(rr,rt)*1.6+.5,0.,1.)*.8*vK;'+
      'o=vec4(vec3(.925,.918,.894)*c+vec3(.122,.702,.647)*g*(1.-c),c+g*(1.-c));}'),
      'uRes uDpr');
    TW.vao=gl.createVertexArray();TW.buf=gl.createBuffer();
    gl.bindVertexArray(TW.vao);gl.bindBuffer(gl.ARRAY_BUFFER,TW.buf);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,28,0);
    gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,28,8);
    gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,28,24);
  }catch(err){gl=null;document.documentElement.classList.add('nogl');return}

  gl.enable(gl.BLEND);gl.clearColor(0,0,0,0);

  function wp(lx,ly,o){
    var sx=lx*CS-ly*SN,sy=lx*SN+ly*CS,d=Math.sqrt(sx*sx+sy*sy),u=d/R;if(u>1.35)return false;
    var ex=Math.max(0,u-U0),g=u-K*ex*ex,gp=1-2*K*ex,dx=d?sx/d:1,dy=d?sy/d:0,e=sm(.25,1.3,u);
    o.x=dx*R*g;o.y=dy*R*g;o.dx=dx;o.dy=dy;o.rr=Math.max(.35,BASE*gp);o.rt=Math.max(.35,BASE*(u?g/u:1))*(1+.6*e*e);
    return Math.abs(o.x)<W/2+6&&Math.abs(o.y)<H/2+6;
  }
  function size(){
    D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.round(W*D);cv.height=Math.round(H*D);gl.viewport(0,0,cv.width,cv.height);
    R=Math.hypot(W,H)/2;n=Math.ceil(1.35*R/PITCH);
    var m=2*n+3,a=new Float32Array(m*m*2),k=0;GN=m*m;
    for(var i=-n-1;i<=n+1;i++)for(var j=-n-1;j<=n+1;j++){a[k++]=i;a[k++]=j}
    gl.bindBuffer(gl.ARRAY_BUFFER,G.buf);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);
  }
  function pick(oxT,oyT){
    var bs=[].map.call(document.querySelectorAll('.btn,h1,footer a,footer>span'),function(b){return b.getBoundingClientRect()});
    for(var t=0;t<40;t++){
      var lx=Math.floor((Math.random()*2-1)*n)*PITCH+oxT,ly=Math.floor((Math.random()*2-1)*n)*PITCH+oyT;
      if(!wp(lx,ly,tmp))continue;
      var x=tmp.x+W/2,y=tmp.y+H/2;if(x<W*.2||x>W*.8)continue;
      if(bs.some(function(b){return x>b.left-24&&x<b.right+24&&y>b.top-24&&y<b.bottom+24}))continue;
      return{ax:lx-oxT,ay:ly-oyT};
    }
    return null;
  }

  function frame(now){
    if(!reduce)requestAnimationFrame(frame);
    var t=reduce?0:(now-T0)/1000,oxT=VX*t,oyT=VY*t,ox=mod(oxT),oy=mod(oyT);CS=Math.cos(OM*t);SN=Math.sin(OM*t);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(G.p);gl.bindVertexArray(G.vao);
    gl.uniform2f(G.uRes,W,H);gl.uniform2f(G.uOff,ox,oy);gl.uniform2f(G.uRot,CS,SN);
    gl.uniform1f(G.uR,R);gl.uniform1f(G.uP,PITCH);gl.uniform1f(G.uDpr,D);
    gl.drawArrays(gl.POINTS,0,GN);

    if(!reduce){
      if(live.length<10&&now>nextT){var d=pick(oxT,oyT);if(d){d.t0=now;d.dur=4500+Math.random()*3000;live.push(d)}nextT=now+600+Math.random()*1200}
      var c=0;
      for(var q=live.length-1;q>=0;q--){
        var L=live[q],p=(now-L.t0)/L.dur;if(p>=1||!wp(L.ax+oxT,L.ay+oyT,tmp)){live.splice(q,1);continue}
        var b=c*7;TB[b]=tmp.x;TB[b+1]=tmp.y;TB[b+2]=tmp.rr;TB[b+3]=tmp.rt;TB[b+4]=tmp.dx;TB[b+5]=tmp.dy;TB[b+6]=Math.min(1,Math.sin(p*Math.PI)*1.7);c++;
      }
      if(c){
        gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(TW.p);gl.bindVertexArray(TW.vao);
        gl.uniform2f(TW.uRes,W,H);gl.uniform1f(TW.uDpr,D);
        gl.bindBuffer(gl.ARRAY_BUFFER,TW.buf);gl.bufferData(gl.ARRAY_BUFFER,TB.subarray(0,c*7),gl.DYNAMIC_DRAW);
        gl.drawArrays(gl.POINTS,0,c);
      }
    }
  }

  size();requestAnimationFrame(frame);
  var rz=0;window.addEventListener('resize',function(){cancelAnimationFrame(rz);rz=requestAnimationFrame(function(){size();if(reduce)frame(0)})});
})();
</script>
